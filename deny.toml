# Configuración de cargo-deny: avisos de seguridad, licencias y duplicados.
# Ejecutar con `cargo deny check` (también corre en CI).

[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
ignore = [
  # Ataque Marvin (canal lateral de tiempo) en `rsa`, sin corrección publicada. Lo arrastra el
  # backend RustCrypto de jsonwebtoken; Taut solo firma y verifica con EdDSA (Ed25519) y nunca
  # construye una clave RSA, así que el código vulnerable no se ejecuta.
  { id = "RUSTSEC-2023-0071", reason = "rsa via jsonwebtoken rust_crypto; Taut only uses EdDSA" },
  # Tiempo no constante en `crypto-bigint` 0.5, que arrastran `p256` y `p384` (ECDSA) desde el
  # mismo backend de jsonwebtoken; la corrección (0.7.6) no es compatible con esa cadena. Taut
  # nunca firma con ECDSA y el verificador rechaza todo token que no sea EdDSA.
  { id = "RUSTSEC-2026-0387", reason = "crypto-bigint via jsonwebtoken p256/p384; Taut only uses EdDSA" },
]

[licenses]
version = 2
confidence-threshold = 0.8
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  "MPL-2.0",
  "Zlib",
  "CC0-1.0",
  "0BSD",
  "OpenSSL",
  "CDLA-Permissive-2.0", # webpki-roots: datos de certificados raíz de Mozilla
  "BSL-1.0",             # xxhash-rust (vía redis): Boost, permisiva y compatible con MIT
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Los crates del workspace se referencian por ruta sin versión; eso no es un comodín real.
allow-wildcard-paths = true
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
