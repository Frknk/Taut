# Configuración de cargo-deny: avisos de seguridad, licencias y duplicados.
# Ejecutar con `cargo deny check` (también corre en CI).

[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
ignore = []

[licenses]
version = 2
confidence-threshold = 0.8
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  "MPL-2.0",
  "Zlib",
  "CC0-1.0",
  "0BSD",
  "OpenSSL",
  "CDLA-Permissive-2.0", # webpki-roots: datos de certificados raíz de Mozilla
  "BSL-1.0",             # xxhash-rust (vía redis): Boost, permisiva y compatible con MIT
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Los crates del workspace se referencian por ruta sin versión; eso no es un comodín real.
allow-wildcard-paths = true
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
