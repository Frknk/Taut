# Infraestructura local de taut.
#   just up      levanta postgres, redis, nats y mailpit
#   just up-all  además construye y levanta los servicios de taut (perfil "app")
#   just nuke    borra también los volúmenes
name: taut

# Entorno común de los servicios de taut dentro de la red de compose.
x-taut-env: &taut-env
  TAUT_APP__ENV: dev
  TAUT_HTTP__ADDR: 0.0.0.0:8080
  TAUT_TELEMETRY__LOG_FORMAT: json
  TAUT_CHECKS__ALLOW_PRIVATE_TARGETS: "true"
  TAUT_NOTIFIER__SMTP_URL: smtp://mailpit:1025
  DATABASE_URL: postgres://taut:taut@postgres:5432/taut
  REDIS_URL: redis://redis:6379
  NATS_URL: nats://nats:4222

x-taut-deps: &taut-deps
  postgres:
    condition: service_healthy
  redis:
    condition: service_healthy
  nats:
    condition: service_healthy

services:
  postgres:
    # TimescaleDB sobre PostgreSQL 17; no existe tag "latest" a propósito (docs/adr/0002).
    image: timescale/timescaledb:2.26.1-pg17
    environment:
      POSTGRES_USER: taut
      POSTGRES_PASSWORD: taut
      POSTGRES_DB: taut
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taut -d taut"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    # Sin persistencia en local: la caché y los locks se reconstruyen solos.
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  nats:
    image: nats:2.11-alpine
    command: ["--jetstream", "--store_dir", "/data", "--http_port", "8222"]
    ports:
      - "4222:4222"
      - "8222:8222"
    volumes:
      - nats-data:/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8222/healthz"]
      interval: 5s
      timeout: 3s
      retries: 10

  # SMTP de desarrollo: guarda todo correo enviado y lo muestra en http://localhost:8025.
  mailpit:
    image: axllent/mailpit:v1.31
    ports:
      - "1025:1025"
      - "8025:8025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Servicios de taut: una imagen por servicio desde el Dockerfile de la raíz. Los puertos del
  # host son los mismos que usa `just run <servicio>`.
  api:
    profiles: ["app"]
    build:
      context: .
      args: { SERVICE: api, GIT_SHA: "${GIT_SHA:-dev}" }
    environment:
      <<: *taut-env
      TAUT_HTTP__CORS_ORIGINS: http://localhost:5173
    ports:
      - "8080:8080"
    depends_on: *taut-deps

  scheduler:
    profiles: ["app"]
    build:
      context: .
      args: { SERVICE: scheduler, GIT_SHA: "${GIT_SHA:-dev}" }
    environment: *taut-env
    ports:
      - "8081:8080"
    # La api aplica las migraciones al arrancar.
    depends_on:
      <<: *taut-deps
      api:
        condition: service_started

  checker:
    profiles: ["app"]
    build:
      context: .
      args: { SERVICE: checker, GIT_SHA: "${GIT_SHA:-dev}" }
    environment: *taut-env
    ports:
      - "8082:8080"
    depends_on:
      nats:
        condition: service_healthy

  incidents:
    profiles: ["app"]
    build:
      context: .
      args: { SERVICE: incidents, GIT_SHA: "${GIT_SHA:-dev}" }
    environment: *taut-env
    ports:
      - "8083:8080"
    depends_on:
      <<: *taut-deps
      api:
        condition: service_started

  notifier:
    profiles: ["app"]
    build:
      context: .
      args: { SERVICE: notifier, GIT_SHA: "${GIT_SHA:-dev}" }
    environment: *taut-env
    ports:
      - "8084:8080"
    depends_on:
      <<: *taut-deps
      mailpit:
        condition: service_healthy
      api:
        condition: service_started

volumes:
  postgres-data:
  nats-data:
