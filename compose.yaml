# Infraestructura local de Taut.
#   just up           levanta postgres, redis, nats y mailpit
#   just up-all       además construye y levanta los servicios de Taut (perfil "app")
#   just obs-up       Prometheus y Grafana (perfil "obs")
#   just loadtest-up  todo lo anterior más el servidor eco de las pruebas de carga (perfil
#                     "loadtest"); k6 corre con `just loadtest <escenario>` (perfil "k6")
#   just nuke         borra también los volúmenes
name: taut

# Entorno común de los servicios de Taut dentro de la red de compose.
x-taut-env: &taut-env
  TAUT_APP__ENV: dev
  TAUT_HTTP__ADDR: 0.0.0.0:8080
  TAUT_TELEMETRY__LOG_FORMAT: json
  TAUT_CHECKS__ALLOW_PRIVATE_TARGETS: "true"
  TAUT_APP__PANEL_URL: http://localhost:5173
  TAUT_NOTIFIER__SMTP_URL: smtp://mailpit:1025
  TAUT_AUTH__URL: http://auth:8080
  DATABASE_URL: postgres://taut:taut@postgres:5432/taut
  REDIS_URL: redis://redis:6379
  NATS_URL: nats://nats:4222

x-taut-deps: &taut-deps
  postgres:
    condition: service_healthy
  redis:
    condition: service_healthy
  nats:
    condition: service_healthy

services:
  postgres:
    # TimescaleDB sobre PostgreSQL 17; no existe tag "latest" a propósito (docs/adr/0002).
    image: timescale/timescaledb:2.26.1-pg17
    environment:
      POSTGRES_USER: taut
      POSTGRES_PASSWORD: taut
      POSTGRES_DB: taut
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taut -d taut"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    # Sin persistencia en local: la caché y los locks se reconstruyen solos.
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  nats:
    image: nats:2.11-alpine
    command: ["--jetstream", "--store_dir", "/data", "--http_port", "8222"]
    ports:
      - "4222:4222"
      - "8222:8222"
    volumes:
      - nats-data:/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8222/healthz"]
      interval: 5s
      timeout: 3s
      retries: 10

  # SMTP de desarrollo: guarda todo correo enviado y lo muestra en http://localhost:8025.
  mailpit:
    image: axllent/mailpit:v1.31
    ports:
      - "1025:1025"
      - "8025:8025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Servicios de taut: una imagen por servicio desde el Dockerfile de la raíz. Los puertos del
  # host son los mismos que usa `just run <servicio>`.
  api:
    profiles: ["app"]
    build:
      context: .
      args: { SERVICE: api, GIT_SHA: "${GIT_SHA:-dev}" }
    environment:
      <<: *taut-env
      TAUT_HTTP__CORS_ORIGINS: http://localhost:5173
    ports:
      - "8080:8080"
    depends_on: *taut-deps

  # Identidad: usuarios, sesiones y la clave que firma los tokens. Sin TAUT_AUTH__SIGNING_KEY
  # genera una clave efímera y sin TAUT_AUTH__TOTP_KEY (cifra los secretos del segundo factor)
  # usa una clave fija de desarrollo (solo dev). La api aplica las migraciones, así que aquí no.
  auth:
    profiles: ["app"]
    build:
      context: .
      args: { SERVICE: auth, GIT_SHA: "${GIT_SHA:-dev}" }
    environment:
      <<: *taut-env
      TAUT_HTTP__CORS_ORIGINS: http://localhost:5173
      TAUT_DATABASE__MIGRATE_ON_START: "false"
    ports:
      - "8086:8080"
    depends_on:
      <<: *taut-deps
      api:
        condition: service_started

  scheduler:
    profiles: ["app"]
    build:
      context: .
      args: { SERVICE: scheduler, GIT_SHA: "${GIT_SHA:-dev}" }
    environment: *taut-env
    ports:
      - "8081:8080"
    # La api aplica las migraciones al arrancar.
    depends_on:
      <<: *taut-deps
      api:
        condition: service_started

  checker:
    profiles: ["app"]
    build:
      context: .
      args: { SERVICE: checker, GIT_SHA: "${GIT_SHA:-dev}" }
    environment: *taut-env
    ports:
      - "8082:8080"
    depends_on:
      nats:
        condition: service_healthy

  incidents:
    profiles: ["app"]
    build:
      context: .
      args: { SERVICE: incidents, GIT_SHA: "${GIT_SHA:-dev}" }
    environment: *taut-env
    ports:
      - "8083:8080"
    depends_on:
      <<: *taut-deps
      api:
        condition: service_started

  notifier:
    profiles: ["app"]
    build:
      context: .
      args: { SERVICE: notifier, GIT_SHA: "${GIT_SHA:-dev}" }
    environment: *taut-env
    ports:
      - "8084:8080"
    depends_on:
      <<: *taut-deps
      mailpit:
        condition: service_healthy
      api:
        condition: service_started

  status-bff:
    profiles: ["app"]
    build:
      context: .
      args: { SERVICE: status-bff, GIT_SHA: "${GIT_SHA:-dev}" }
    environment: *taut-env
    ports:
      - "8085:8080"
    depends_on:
      postgres:
        condition: service_healthy
      api:
        condition: service_started

  # Observabilidad local: Prometheus scrapea los servicios (infra/observability/prometheus.yml) y
  # recibe las métricas de k6 por remote write; Grafana en http://localhost:3000, sin login (solo
  # dev), con los tableros de infra/observability/grafana/dashboards.
  prometheus:
    profiles: ["obs"]
    image: prom/prometheus:v3.15.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=30d
      - --web.enable-remote-write-receiver
    ports:
      - "9090:9090"
    volumes:
      - ./infra/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:9090/-/ready"]
      interval: 5s
      timeout: 3s
      retries: 10

  grafana:
    profiles: ["obs"]
    image: grafana/grafana:13.2.3
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /etc/grafana/dashboards/taut-services.json
    ports:
      - "3000:3000"
    volumes:
      - ./infra/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/observability/grafana/dashboards:/etc/grafana/dashboards:ro
    depends_on:
      prometheus:
        condition: service_healthy

  # Conexiones, bloqueos y tamaño de PostgreSQL para Prometheus (pg_stat_activity_count…).
  postgres-exporter:
    profiles: ["obs"]
    image: prometheuscommunity/postgres-exporter:v0.20.1
    environment:
      DATA_SOURCE_NAME: postgresql://taut:taut@postgres:5432/taut?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy

  # Destino de los monitores de las pruebas de carga (http://echo/): responde 200 al instante,
  # así se mide Taut y no internet. Sin puerto en el host.
  echo:
    profiles: ["loadtest"]
    image: traefik/whoami:v1.12.0

  # k6 dentro de la red de compose, para no medir el reenvío de puertos del host. No arranca con
  # `up`: lo corre `just loadtest <escenario>` con `docker compose run`. Ver loadtest/README.md.
  k6:
    profiles: ["k6"]
    image: grafana/k6:2.3.0
    working_dir: /loadtest
    volumes:
      - ./loadtest:/loadtest
    environment:
      K6_PROMETHEUS_RW_SERVER_URL: http://prometheus:9090/api/v1/write
      # Las tendencias (http_req_duration…) van como histogramas nativos: cuantiles por ventana.
      K6_FEATURES: native-histograms
      K6_PROMETHEUS_RW_STALE_MARKERS: "true"
      API_URL: http://api:8080
      AUTH_URL: http://auth:8080
      STATUS_URL: http://status-bff:8080
      ECHO_URL: http://echo/
      SERVICE_URLS: >-
        api=http://api:8080,auth=http://auth:8080,scheduler=http://scheduler:8080,checker=http://checker:8080,incidents=http://incidents:8080,notifier=http://notifier:8080,status-bff=http://status-bff:8080

volumes:
  postgres-data:
  nats-data:
  prometheus-data:
