[workspace]
resolver = "3"
members = ["crates/*", "services/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
repository = "https://github.com/Frknk/taut"
license = "MIT"
publish = false

[workspace.dependencies]
# Crates internos
taut-config = { path = "crates/config" }
taut-telemetry = { path = "crates/telemetry" }
taut-db = { path = "crates/db" }
taut-http = { path = "crates/http" }
taut-model = { path = "crates/model" }

# Runtime y HTTP
tokio = { version = "1.53", features = ["full"] }
axum = { version = "0.8", features = ["macros"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.7", features = ["trace", "request-id", "cors", "timeout", "catch-panic"] }
http = "1"
http-body-util = "0.1"

# Datos
sqlx = { version = "0.9", default-features = false, features = [
  "runtime-tokio",
  "tls-rustls",
  "postgres",
  "macros",
  "migrate",
  "json",
  "uuid",
  "chrono",
] }

# Configuración y serialización
figment = { version = "0.10", features = ["env"] }
dotenvy = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Observabilidad
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
metrics = "0.24"
metrics-exporter-prometheus = { version = "0.18", default-features = false }

# Errores y utilidades
thiserror = "2"
anyhow = "1"
ulid = "3"
uuid = { version = "1", features = ["v4", "v7", "serde"] }
url = "2"
chrono = { version = "0.4", features = ["serde"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

# Las dependencias se compilan con algo de optimización también en dev para que los
# tests de integración y el servidor local no sean lentos.
[profile.dev.package."*"]
opt-level = 1
