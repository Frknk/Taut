# CI de taut: corre en cada pull request y en cada push a main.
# Lo mismo que `just check` en local, repartido en tres jobs independientes.
name: ci

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  rust:
    name: rust (fmt, clippy, deny, tests)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: timescale/timescaledb:2.26.1-pg17
        env:
          POSTGRES_USER: taut
          POSTGRES_PASSWORD: taut
          POSTGRES_DB: taut
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U taut -d taut"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgres://taut:taut@localhost:5432/taut
      REDIS_URL: redis://localhost:6379
      NATS_URL: nats://localhost:4222
      # Compila contra la caché .sqlx; solo el paso de tests habla con la base de datos.
      SQLX_OFFLINE: "true"
    steps:
      - uses: actions/checkout@v7
      # Los services de Actions no aceptan argumentos y NATS necesita --jetstream.
      - name: NATS con JetStream
        run: docker run -d --name nats -p 4222:4222 nats:2.11-alpine --jetstream
      - uses: dtolnay/rust-toolchain@1.98.1
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest,cargo-deny
      - uses: cargo-bins/cargo-binstall@v1.25.3
      - name: Instalar sqlx-cli
        run: cargo binstall -y --locked sqlx-cli
      - name: Formato
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Dependencias (avisos, licencias, duplicados)
        run: cargo deny check
      # Las macros de sqlx se verifican contra la base real en los tests y en `prepare --check`,
      # así que necesita el esquema.
      - name: Migraciones
        run: sqlx migrate run
      - name: Tests
        env:
          SQLX_OFFLINE: "false"
        run: cargo nextest run --workspace
      - name: Caché offline de sqlx al día
        run: cargo sqlx prepare --check --workspace

  web:
    name: web (lint, fmt, check, test, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run fmt:check
      - run: bun run check
      - run: bun run test
      - run: bun run build

  docker:
    # El Dockerfile es el mismo para todos los servicios; construir uno lo valida. build.yml
    # construye y publica todos al fusionar en main.
    name: docker (build de la imagen de la api)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          build-args: |
            SERVICE=api
            GIT_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
