# Publica la imagen de cada servicio en GHCR en cada push a main y en cada tag v*.
# Por ahora solo linux/amd64: compilar Rust bajo QEMU para arm64 tarda demasiado.
# Cuando se elija la nube (semana 2) se agrega arm64 con runners nativos o cross-compilación.
name: build

on:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read
  packages: write

jobs:
  image:
    name: image ${{ matrix.service }} (ghcr.io)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [api, auth, scheduler, checker, incidents, notifier, status-bff]
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/taut-${{ matrix.service }}
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          # metadata-action pasa el nombre a minúsculas, como exige GHCR.
          images: ${{ env.IMAGE }}
          tags: |
            type=sha,format=short
            type=ref,event=branch
            type=semver,pattern={{version}}
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            SERVICE=${{ matrix.service }}
            GIT_SHA=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
