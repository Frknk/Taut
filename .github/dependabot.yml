# Actualizaciones semanales agrupadas por minor/patch para no inundar de PRs.
version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: "chore(deps)"
    groups:
      rust-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: bun
    directory: /web
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: "chore(deps)"
    groups:
      web-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: "ci(deps)"
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: docker
    directory: /services/api
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: "build(deps)"
